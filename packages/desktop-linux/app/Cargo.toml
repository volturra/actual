[package]
name = "actual-linux"
description = "A native Linux desktop client for Actual Budget"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "actual-linux"
path = "src/main.rs"

[dependencies]
actual-sync.workspace = true
actual-budget.workspace = true
rusqlite.workspace = true
serde_json.workspace = true
chrono.workspace = true
gtk = { package = "gtk4", version = "0.11", features = ["v4_14"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_5"] }
async-channel = "2"
glib = "0.22"
