[workspace]
resolver = "2"
members = ["crates/actual-sync", "crates/actual-budget", "app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.80"

[workspace.dependencies]
actual-sync = { path = "crates/actual-sync" }
actual-budget = { path = "crates/actual-budget" }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
